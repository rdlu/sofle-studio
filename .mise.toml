[tools]
bun = "1.3.11"

[tasks.setup]
description = "Install dependencies (postinstall builds the ZMK Studio client packages)"
run = "bun install"

[tasks.dev]
description = "Run the dev server (http://localhost:5173 — open in Chrome/Edge for WebSerial/WebBluetooth)"
run = "bun run dev"

[tasks.build]
description = "Production build → dist/ (generates the PWA service worker + manifest)"
run = "bun run build"

[tasks.preview]
description = "Serve the production build locally (use to test offline/PWA behavior)"
run = "bun run preview"

[tasks.lint]
description = "Lint with ESLint"
run = "bun run lint"

[tasks.format]
description = "Format the codebase with Prettier"
run = "bun run format"

[tasks.test]
description = "Run the Jest test suite"
run = "bun run test"

[tasks.audit]
description = "Security-audit dependencies"
run = "bun audit"
